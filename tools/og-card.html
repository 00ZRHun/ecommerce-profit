<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card source — render to assets/og-image.png</title>
<style>
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: block;
    src: url("/assets/fonts/manrope-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url("/assets/fonts/inter-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Fraunces";
    font-style: normal;
    font-weight: 300 700;
    font-display: block;
    src: url("/assets/fonts/fraunces-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Fraunces";
    font-style: italic;
    font-weight: 300 700;
    font-display: block;
    src: url("/assets/fonts/fraunces-italic-latin.woff2") format("woff2");
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #0f0b08;
    color: #f5f0ec;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 60px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(169, 89, 40, 0.3), transparent 62%),
      radial-gradient(700px 480px at -8% 108%, rgba(169, 89, 40, 0.17), transparent 60%),
      linear-gradient(160deg, #19120e 0%, #0f0b08 58%, #0f0b08 100%);
    overflow: hidden;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(760px 520px at 22% 8%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(760px 520px at 22% 8%, #000 0%, transparent 78%);
  }

  .rule {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #a95928 0%, #e7bda3 62%, rgba(231, 189, 163, 0) 100%);
  }

  .brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .brand img { width: 56px; height: 56px; display: block; }

  .brand-name {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #ffffff;
  }

  .brand-sub {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #db9e78;
    margin-top: 5px;
  }

  .headline {
    position: relative;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 88px;
    line-height: 1.01;
    letter-spacing: -0.03em;
    color: #ffffff;
    max-width: 1000px;
  }

  .headline span,
  .headline em { display: block; }

  .headline em {
    font-style: italic;
    font-weight: 500;
    letter-spacing: -0.04em;
    background: linear-gradient(96deg, #c9784c 0%, #efc6a7 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lower {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  .lede {
    font-size: 25px;
    line-height: 1.42;
    font-weight: 400;
    color: #e0ac8b;
    max-width: 620px;
  }

  .lede strong { color: #f4eeeb; font-weight: 600; }

  .badge {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    text-align: right;
  }

  .badge-value {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #e7bda3;
    white-space: nowrap;
  }

  .badge-label {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9f887a;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Profit Guild social card">
    <div class="grid"></div>
    <div class="rule"></div>

    <div class="brand">
      <img src="/assets/favicon.svg" alt="" />
      <div>
        <div class="brand-name">Profit Guild</div>
        <div class="brand-sub">Profit strategy studio</div>
      </div>
    </div>

    <h1 class="headline"><span>Make growth</span><em>worth keeping.</em></h1>

    <div class="lower">
      <p class="lede">Profit-first strategy for ecommerce founders doing <strong>$30k&ndash;$1M+/month</strong>. We turn revenue into profit you can keep &mdash; without spending more on ads.</p>
      <div class="badge">
        <div class="badge-value">+3&ndash;8 pts</div>
        <div class="badge-label">Margin in 90 days</div>
      </div>
    </div>
  </div>
</body>
</html>
