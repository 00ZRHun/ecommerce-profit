<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card source — render to assets/og-image.png</title>
<style>
  @font-face {
    font-family: "Manrope";
    font-style: normal;
    font-weight: 200 800;
    font-display: block;
    src: url("/assets/fonts/manrope-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    font-display: block;
    src: url("/assets/fonts/inter-latin.woff2") format("woff2");
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #040a13;
    color: #eaf5f0;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(20, 189, 131, 0.28), transparent 62%),
      radial-gradient(700px 480px at -8% 108%, rgba(20, 189, 131, 0.16), transparent 60%),
      linear-gradient(160deg, #07131e 0%, #040a13 58%, #03080f 100%);
    overflow: hidden;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(760px 520px at 22% 8%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(760px 520px at 22% 8%, #000 0%, transparent 78%);
  }

  .rule {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 8px;
    background: linear-gradient(90deg, #14bd83 0%, #8bffd6 62%, rgba(139, 255, 214, 0) 100%);
  }

  .brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .brand img { width: 56px; height: 56px; display: block; }

  .brand-name {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 27px;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #ffffff;
  }

  .brand-sub {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6fe4b6;
    margin-top: 5px;
  }

  .headline {
    position: relative;
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 78px;
    line-height: 1.03;
    letter-spacing: -0.035em;
    color: #ffffff;
    max-width: 950px;
    text-wrap: balance;
  }

  .headline em {
    font-style: normal;
    background: linear-gradient(96deg, #14bd83 0%, #8bffd6 96%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lower {
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 48px;
  }

  .lede {
    font-size: 25px;
    line-height: 1.42;
    font-weight: 400;
    color: #a9c2bd;
    max-width: 620px;
  }

  .lede strong { color: #eaf5f0; font-weight: 600; }

  .badge {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    text-align: right;
  }

  .badge-value {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 54px;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #8bffd6;
    white-space: nowrap;
  }

  .badge-label {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7f9a95;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Profit Growth Coaching social card">
    <div class="grid"></div>
    <div class="rule"></div>

    <div class="brand">
      <img src="/assets/favicon.svg" alt="" />
      <div>
        <div class="brand-name">Profit Growth Coaching</div>
        <div class="brand-sub">Ecommerce profitability</div>
      </div>
    </div>

    <h1 class="headline">Keep more of every <em>dollar you sell.</em></h1>

    <div class="lower">
      <p class="lede">Profit-first coaching for ecommerce founders doing <strong>$30k&ndash;$1M+/month</strong>. Find the margin leaking out of your store &mdash; without spending more on ads.</p>
      <div class="badge">
        <div class="badge-value">+3&ndash;8 pts</div>
        <div class="badge-label">Margin in 90 days</div>
      </div>
    </div>
  </div>
</body>
</html>
